<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0f1117;color:#e6e8ee;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:24px 16px 48px}
.header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;margin-bottom:20px;border-bottom:1px solid #232636}
.header h1{font-size:22px;letter-spacing:1px}
.header .meta{font-size:12px;color:#8a93a3}
.card{background:#1a1e2a;border:1px solid #2a3040;border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.35)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #2a3040}
.card-head h2{font-size:18px;font-weight:600}
.card-head .code{font-size:12px;color:#6ea8fe;background:#162033;padding:2px 8px;border-radius:4px}
.card-head .pnl{margin-left:auto;font-size:16px;font-weight:700}
.card-head .pnl.pos{color:#4caf7d}
.card-head .pnl.neg{color:#e06c6c}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.stat{background:#131620;border-radius:8px;padding:10px 6px;text-align:center}
.stat span{display:block;font-size:10px;color:#8a93a3;margin-bottom:4px}
.stat b{font-size:15px;font-weight:600}
.stat b.red{color:#f5222d}
.chart-title{font-size:11px;color:#8a93a3;margin:6px 0 2px;padding-left:4px}
.vchart{background:#131620;border-radius:8px;height:280px}
.vchart.vol{height:130px}
.err{border-color:#b3403a;padding:20px;text-align:center;color:#e06c6c}
.footer{text-align:center;font-size:11px;color:#555;margin-top:24px;padding-top:12px;border-top:1px solid #232636}

function initChart(domId, d, chartType) {
  if (!window.VChart) { document.getElementById(domId).textContent = 'VChart CDN 加载失败'; return; }
  const vchart = window.VChart;

  let spec;
  if (chartType === 'line') {
    const closeData = d.dates.map((date, i) => ({
      date, open: d.opens[i], high: d.highs[i], low: d.lows[i],
      close: d.closes[i], volume: d.vols[i]
    }));
    spec = {
      type: 'line',
      data: [{ id: 'close', values: closeData }],
      xField: 'date',
      yField: 'close',
      axis: {
        xAxis: { label: { rotate: 90, fontSize: 9 } },
        yAxis: { label: { formatter: (v) => v.toFixed(2) } },
      },
      markLine: {
        data: [
          { y: d.cost, name: '成本' + d.cost,
             line: { color: '#1890ff', type: 'dashed', width: 1.5 },
             label: { text: '成本' + d.cost, color: '#1890ff', fontSize: 10 } },
          { y: d.stop_loss, name: '止损' + d.stop_loss,
             line: { color: '#f5222d', type: 'dashed', width: 1.5 },
             label: { text: '止损' + d.stop_loss, color: '#f5222d', fontSize: 10 } },
        ]
      },
      style: { fontFamily: 'sans-serif' },
      theme: 'dark',
      title: { text: '', subtext: '蓝线=成本 红线=止损 最高点=' + d.peak },
    };
  } else {
    spec = {
      type: 'bar',
      data: [{ id: 'volume', values: d.dates.map((date, i) => ({ date, volume: d.vols[i] })) }],
      xField: 'date',
      yField: 'volume',
      axis: {
        xAxis: { label: { rotate: 90, fontSize: 9 } },
        yAxis: { label: { formatter: (v) => (v/10000).toFixed(0) + '万' } },
      },
      style: { fontFamily: 'sans-serif' },
      theme: 'dark',
    };
  }

  const chart = new vchart.Chart(document.getElementById(domId), spec);
  chart.renderSync();
}
