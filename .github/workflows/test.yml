name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip config set global.timeout 60
          pip config set global.index-url https://pypi.org/simple/
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov
        timeout-minutes: 10

      - name: Run tests (tests/ + scripts/, exclude environment-dependent)
        # 排除原因 (2026-10-28 审查记录):
        #   dispatch_audit / ic_monitor / p0_boundaries / self_heal_* /
        #   live_filter / machine_wake / p1c_runbook / coordination_regression /
        #   full_suite → 需 hermes 二进制 / 本地数据文件 / 网络数据源, CI runner 不可用
        #   恢复条件: 以上测试的本地数据依赖改为 fixture / 容器化后移除此 -k
        run: |
          python -m pytest tests/ scripts/test_*.py
            --ignore=tests/test_5_transitions.py \
            --ignore=tests/test_a12_assertion_effectiveness.py \
            --ignore=tests/test_agency_combo.py \
            --ignore=tests/test_agency_research.py \
            --ignore=tests/test_atomic_json.py \
            --ignore=tests/test_backtest_execution.py \
            --ignore=tests/test_backtest_fast_inds.py \
            --ignore=tests/test_board_data_sync.py \
            --ignore=tests/test_board_server.py \
            --ignore=tests/test_board_watchdog.py \
            --ignore=tests/test_bootstrap_contract.py \
            --ignore=tests/test_bot_config.py \
            --ignore=tests/test_circuit_breaker.py \
            --ignore=tests/test_closedloop_health.py \
            --ignore=tests/test_compute_indicators_date.py \
            --ignore=tests/test_cooldown_alias_load.py \
            --ignore=tests/test_cooldown_integration.py \
            --ignore=tests/test_d8_d9_tradability_filters.py \
            --ignore=tests/test_dashboard_data_api.py \
