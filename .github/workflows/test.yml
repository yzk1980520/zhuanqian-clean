name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip config set global.timeout 60
          pip config set global.index-url https://pypi.org/simple/
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov
        timeout-minutes: 10

      - name: Run tests (exclude environment-dependent)
        run: |
          python -m pytest scripts/test_*.py \
            --ignore=scripts/test_dispatch_audit_check.py \
            --ignore=scripts/test_ic_monitor_coverage.py \
            --ignore=scripts/test_p0_boundaries.py \
            --ignore=scripts/test_p0_boundaries_v2.py \
            --ignore=scripts/test_self_heal_p04_threshold.py \
            --ignore=scripts/test_self_heal_p10_p11.py \
            --ignore=scripts/test_self_heal_p12.py \
            --ignore=scripts/test_self_heal_recheck.py \
            --ignore=scripts/test_self_heal_wake_matrix.py \
            --ignore=scripts/test_live_filter_guards.py \
            --ignore=scripts/test_machine_wake_state.py \
            --ignore=scripts/test_p1c_runbook_path.py \
            --ignore=scripts/test_coordination_regression.py \
            --ignore=scripts/test_full_suite.py \
            -v --cov=scripts --cov-report=xml
        timeout-minutes: 10
