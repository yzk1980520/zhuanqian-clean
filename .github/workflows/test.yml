name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip config set global.timeout 60
          pip config set global.index-url https://pypi.org/simple/
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov
        timeout-minutes: 10

      - name: Run tests (tests/ + scripts/, exclude environment-dependent)
        # 排除原因 (2026-10-28 审查记录):
        #   dispatch_audit / ic_monitor / p0_boundaries / self_heal_* /
        #   live_filter / machine_wake / p1c_runbook / coordination_regression /
        #   full_suite → 需 hermes 二进制 / 本地数据文件 / 网络数据源, CI runner 不可用
        #   恢复条件: 以上测试的本地数据依赖改为 fixture / 容器化后移除此 -k
        run: |
          python -m pytest tests/ scripts/test_*.py \
            -k "not (dispatch_audit or ic_monitor or p0_boundaries or self_heal_p04 or self_heal_p10 or self_heal_p12 or self_heal_recheck or self_heal_wake or live_filter or machine_wake or p1c_runbook or coordination_regression or full_suite or factor_weights_drift or runner_lock or fake_positive or stop_loss_strategy or t7_qsp)" \
            -v --cov=scripts --cov-report=xml
        timeout-minutes: 15
