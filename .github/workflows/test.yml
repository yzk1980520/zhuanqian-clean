name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip config set global.timeout 60
          pip config set global.index-url https://pypi.org/simple/
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov
        timeout-minutes: 10

      - name: Run tests (exclude environment-dependent)
        run: |
          python -m pytest scripts/test_*.py \
            -k "not (dispatch_audit or ic_monitor or p0_boundaries or self_heal_p04 or self_heal_p10 or self_heal_p12 or self_heal_recheck or self_heal_wake or live_filter or machine_wake or p1c_runbook or coordination_regression or full_suite)" \
            -v --cov=scripts --cov-report=xml
        timeout-minutes: 10
