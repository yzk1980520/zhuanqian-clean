name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # 仓库 4.7GB，全量克隆超时；浅克隆足够测试

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 2026-10-15 老六修复: 原 pip install -r requirements.txt 全量安装
      # akshare/pytdx 等国内源大包, runner 上高频失败; 改装 CI 最小依赖
      # (AST 扫描实测测试仅需 numpy+requests; pytest 系由下一步显式安装)
      # 2026-10-24 总管修复: 增加pip超时配置+镜像源, 防止GitHub runner网络不稳定导致安装失败
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip config set global.timeout 60
          pip config set global.index-url https://pypi.org/simple/
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov
        timeout-minutes: 10

      # 2026-10-15 老六修复: 原 test 命令 glob 无匹配即 exit 4 的根因是
      # .gitignore scripts/* 把测试文件全挡在 git 外, checkout 后无文件可跑;
      # 已放行 !scripts/test_*.py, 此处命令保持不变
      - name: Run tests
        run: |
          python -m pytest scripts/test_*.py -v --cov=scripts --cov-report=xml
        timeout-minutes: 10

      # 2026-10-15 老六修复: 删除 codecov/codecov-action@v3 步骤 —
      # 仓库未在 codecov 注册, 该 action 必失败, 是 checks 0/1 的确定成因之一
